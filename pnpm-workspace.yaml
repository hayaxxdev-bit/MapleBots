# pnpm-workspace.yaml
# Konfigurasi workspace untuk proyek monorepo
# Namun untuk proyek single package, ini bisa disederhanakan

packages:
  - "src/**"
  - "!src/tests/**"

# Optional: Only allow pnpm
prefer-workspace-packages: true

# Optional: Shared dependencies
shared-workspace-lockfile: true

# Optional: Store packages in node_modules/.pnpm
storeDir: .pnpm-store