services:
  maple-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: maple-bots

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp

    ports:
      - "3000:3000"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - maple-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  redis:
    image: redis:7-alpine

    container_name: maple-bot-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    networks:
      - maple-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  redis-data:


networks:
  maple-network:
    driver: bridge